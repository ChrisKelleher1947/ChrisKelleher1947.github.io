<!DOCTYPE html>
<html>
<head>
    <title>Deepfake Audio Detector - Demo</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            background: #f4f6f8;
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .header a {
            text-decoration: none;
            color: #007BFF;
            font-weight: bold;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
        }

        .drop-zone {
            border: 2px dashed #bbb;
            border-radius: 10px;
            padding: 30px;
            margin: 20px 0;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #007BFF;
            background: #eef6ff;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            font-size: 16px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        audio {
            margin-top: 15px;
            width: 100%;
        }

        .spinner {
            margin: 20px auto;
            border: 5px solid #eee;
            border-top: 5px solid #007BFF;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .real { color: green; font-weight: bold; }
        .fake { color: red; font-weight: bold; }

        .bar {
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            margin: 8px 0;
        }

        .bar-fill {
            height: 100%;
            border-radius: 5px;
        }

        .small {
            font-size: 12px;
            color: #777;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="header">
    <a href="index.html">← Back to Project Home</a>
    <div><strong>Deepfake Demo</strong></div>
</div>

<div class="card">

    <h1>Deepfake Audio Detector</h1>
    <p>Upload or record audio to analyse</p>

    <div class="drop-zone" id="dropZone">
        <p>Drag & drop or click to upload any audio file</p>
        <input type="file" id="fileInput" accept="*/*">
    </div>

 
    <button onclick="startRecording()">Record</button>
    <button onclick="stopRecording()">⏹ Stop</button>

    <audio id="audioPreview" controls style="display:none;"></audio>

    <br>
    <button onclick="uploadFile()">Analyse Audio</button>

    <div class="spinner" id="spinner"></div>
    <p id="status"></p>

    <div id="result"></div>

    <p class="small">
        Best results with high-quality audio. Compressed audio may reduce accuracy.
    </p>

</div>

<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>

<script>
const API_URL = "https://oven-dime-empower.ngrok-free.dev/detect";

const fileInput = document.getElementById("fileInput");
const dropZone = document.getElementById("dropZone");
const audioPreview = document.getElementById("audioPreview");
const spinner = document.getElementById("spinner");
const status = document.getElementById("status");
const resultDiv = document.getElementById("result");

let selectedFile = null;
let mediaRecorder;
let recordedChunks = [];

// Upload click
dropZone.addEventListener("click", () => fileInput.click());

fileInput.addEventListener("change", e => {
    handleFile(e.target.files[0]);
});

// Drag/drop
dropZone.addEventListener("dragover", e => {
    e.preventDefault();
    dropZone.classList.add("dragover");
});

dropZone.addEventListener("dragleave", () => {
    dropZone.classList.remove("dragover");
});

dropZone.addEventListener("drop", e => {
    e.preventDefault();
    dropZone.classList.remove("dragover");
    handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
    if (!file) return;
    selectedFile = file;
    preview(file);
}

function preview(file) {
    const url = URL.createObjectURL(file);
    audioPreview.src = url;
    audioPreview.style.display = "block";
    status.innerText = "File ready: " + file.name;
}

// RECORDING
async function startRecording() {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

    mediaRecorder = new MediaRecorder(stream);
    recordedChunks = [];

    mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);

    mediaRecorder.onstop = async () => {
        const blob = new Blob(recordedChunks);

        // Convert to PCM
        const arrayBuffer = await blob.arrayBuffer();
        const audioCtx = new AudioContext();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

        const targetRate = 16000;

        const offlineCtx = new OfflineAudioContext(
            1,
            audioBuffer.duration * targetRate,
            targetRate
        );

        const source = offlineCtx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(offlineCtx.destination);
        source.start();

        const renderedBuffer = await offlineCtx.startRendering();
        const samples = renderedBuffer.getChannelData(0);


        // Convert to MP3
        const mp3encoder = new lamejs.Mp3Encoder(1, 16000, 128);
        let mp3Data = [];

        let sampleBlockSize = 1152;
        for (let i = 0; i < samples.length; i += sampleBlockSize) {
            let sampleChunk = samples.subarray(i, i + sampleBlockSize);
            let int16Chunk = new Int16Array(sampleChunk.length);

            for (let j = 0; j < sampleChunk.length; j++) {
                int16Chunk[j] = sampleChunk[j] * 32767;
            }

            let mp3buf = mp3encoder.encodeBuffer(int16Chunk);
            if (mp3buf.length > 0) mp3Data.push(mp3buf);
        }

        let mp3buf = mp3encoder.flush();
        if (mp3buf.length > 0) mp3Data.push(mp3buf);

        const mp3Blob = new Blob(mp3Data, { type: "audio/mp3" });

        selectedFile = new File([mp3Blob], "recording.mp3");
        preview(selectedFile);
        status.innerText = "Recording ready (MP3)";
    };

    mediaRecorder.start();
    status.innerText = "Recording...";
}

function stopRecording() {
    if (mediaRecorder) {
        mediaRecorder.stop();
    }
}

// Upload
async function uploadFile() {
    if (!selectedFile) {
        alert("Please select or record audio first.");
        return;
    }

    const formData = new FormData();
    formData.append("file", selectedFile);

    spinner.style.display = "block";
    status.innerText = "Analysing...";
    resultDiv.innerHTML = "";

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        const cls = data.verdict === "REAL" ? "real" : "fake";

        resultDiv.innerHTML = `
            <div class="${cls}">Verdict: ${data.verdict}</div>

            <div>Real: ${(data.confidence_real * 100).toFixed(1)}%</div>
            <div class="bar">
                <div class="bar-fill" style="width:${data.confidence_real*100}%; background:green;"></div>
            </div>

            <div>Fake: ${(data.confidence_fake * 100).toFixed(1)}%</div>
            <div class="bar">
                <div class="bar-fill" style="width:${data.confidence_fake*100}%; background:red;"></div>
            </div>
        `;

        status.innerText = "Done";

    } catch (err) {
        console.error(err);
        status.innerText = "Error connecting to server.";
    }

    spinner.style.display = "none";
}
</script>

</body>
</html>
